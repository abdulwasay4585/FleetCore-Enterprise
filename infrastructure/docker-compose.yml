version: '3.8'

# ==============================================================================
# FleetCore Enterprise — Production & Development Docker Compose Stack
# All secrets MUST be defined in your .env file (see .env.example)
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: fleetcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleetcore_db}
      POSTGRES_USER: ${POSTGRES_USER:-fleetcore_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD environment variable is required}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleetcore_admin} -d ${POSTGRES_DB:-fleetcore_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: fleetcore-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: fleetcore-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: redis:7.2-alpine
    container_name: fleetcore-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ai-sidecar:
    build:
      context: ../emulators
      dockerfile: Dockerfile
    container_name: fleetcore-ai-sidecar
    restart: unless-stopped
    ports:
      - "${AI_SIDECAR_PORT:-8098}:8098"
    environment:
      AI_SIDECAR_PORT: "8098"

  ingestion-server:
    build:
      context: ../ingestion-server
      dockerfile: Dockerfile
    container_name: fleetcore-ingestion-go
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9095:9095"
      - "9096:9096/udp"
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: telemetry.raw
      TCP_PORT: "9095"
      UDP_PORT: "9096"
    depends_on:
      - kafka

  core-api:
    build:
      context: ../core-api
      dockerfile: Dockerfile
    container_name: fleetcore-api-spring
    restart: unless-stopped
    ports:
      - "${CORE_API_PORT:-8081}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fleetcore_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fleetcore_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD environment variable is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?Error: JWT_SECRET environment variable is required}
      AI_SIDECAR_URL: http://ai-sidecar:8098/api/v1/stretch/ai
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-sidecar:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: fleetcore-frontend-next
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws/telemetry}
      NEXT_PUBLIC_AI_SIDECAR_URL: ${NEXT_PUBLIC_AI_SIDECAR_URL:-http://localhost:8098}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
    depends_on:
      - core-api

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
