# ═══════════════════════════════════════════════════════════════════════════
# FleetCore Enterprise — Datadog Observability Configuration (Section 17)
# Full distributed tracing: IoT Device → Kafka → Flink → DB → WebSocket → Browser
# ═══════════════════════════════════════════════════════════════════════════

# --- Datadog Agent Configuration ---
api_key: ${DD_API_KEY}
site: datadoghq.com
hostname: fleetcore-${ENVIRONMENT}

# --- APM (Application Performance Monitoring) ---
apm_config:
  enabled: true
  apm_non_local_traffic: true
  env: production
  max_traces_per_second: 200

# --- Logs Collection ---
logs_enabled: true
logs_config:
  container_collect_all: true
  processing_rules:
    - type: mask_sequences
      name: mask_database_passwords
      replace_placeholder: "[REDACTED]"
      pattern: "password=[^\\s]+"

# --- Infrastructure Monitoring ---
process_config:
  enabled: true

# --- Custom Checks for FleetCore ---
instances:
  # IoT Ingestion Server (Go)
  - name: fleetcore.ingestion
    check: tcp_check
    host: localhost
    port: 9095
    tags:
      - service:ingestion-server
      - team:iot-platform

  # Core API (Spring Boot)
  - name: fleetcore.core_api
    check: http_check
    url: http://localhost:8080/actuator/health
    tags:
      - service:core-api
      - team:backend

  # Flink Stream Processor
  - name: fleetcore.flink
    check: http_check
    url: http://localhost:8081/overview
    tags:
      - service:flink-processor
      - team:streaming

  # ML Predictive Maintenance
  - name: fleetcore.ml_service
    check: http_check
    url: http://localhost:8090/health
    tags:
      - service:ml-maintenance
      - team:data-science

---
# ═══════════════════════════════════════════════════════════════════════════
# Datadog Dashboard Definition — FleetCore Command Center
# ═══════════════════════════════════════════════════════════════════════════

dashboard:
  title: "FleetCore Enterprise — System Health"
  description: "Real-time observability for all FleetCore microservices"
  layout_type: ordered
  widgets:

    # --- Row 1: IoT Ingestion Metrics ---
    - title: "TCP Connections (Ingestion Server)"
      type: timeseries
      requests:
        - q: "avg:fleetcore.ingestion.tcp_connections{*}"
      tags: [service:ingestion-server]

    - title: "Messages/sec (Kafka Producer)"
      type: timeseries
      requests:
        - q: "rate:fleetcore.kafka.messages_produced{topic:telemetry.raw}.as_rate()"

    - title: "Kafka Consumer Lag"
      type: query_value
      requests:
        - q: "max:kafka.consumer.lag{consumer_group:fleetcore-api}"
      conditional_formats:
        - value: 10000
          palette: white_on_red
        - value: 1000
          palette: white_on_yellow

    # --- Row 2: API Performance ---
    - title: "API Response Time (p99)"
      type: timeseries
      requests:
        - q: "percentile:trace.servlet.request.duration{service:core-api} by {resource_name}.as_count()"

    - title: "API Error Rate"
      type: timeseries
      requests:
        - q: "sum:trace.servlet.request.errors{service:core-api}.as_rate() / sum:trace.servlet.request.hits{service:core-api}.as_rate() * 100"

    # --- Row 3: Database Performance ---
    - title: "TimescaleDB Query Duration (p95)"
      type: timeseries
      requests:
        - q: "percentile:postgresql.queries.duration{dbname:fleetcore}"

    - title: "Active DB Connections"
      type: query_value
      requests:
        - q: "avg:postgresql.connections{dbname:fleetcore}"

    # --- Row 4: WebSocket & Frontend ---
    - title: "Active WebSocket Sessions"
      type: query_value
      requests:
        - q: "sum:fleetcore.websocket.active_sessions{*}"

    - title: "Telemetry Events/sec (End-to-End)"
      type: timeseries
      requests:
        - q: "rate:fleetcore.telemetry.events_processed{*}.as_rate()"

---
# ═══════════════════════════════════════════════════════════════════════════
# Datadog Monitors (Alerting)
# ═══════════════════════════════════════════════════════════════════════════

monitors:
  - name: "Kafka Consumer Lag > 50,000"
    type: metric alert
    query: "max(last_5m):max:kafka.consumer.lag{consumer_group:fleetcore-api} > 50000"
    message: |
      {{#is_alert}}
      🚨 Kafka consumer lag exceeds 50K messages!
      Consumer group: fleetcore-api
      Current lag: {{value}}
      @slack-fleetcore-alerts @pagerduty-fleetcore
      {{/is_alert}}
    tags: [service:kafka, severity:critical]

  - name: "Ingestion Server TCP Connection Drop"
    type: metric alert
    query: "avg(last_5m):avg:fleetcore.ingestion.tcp_connections{*} < 100"
    message: |
      {{#is_alert}}
      ⚠️ Ingestion server TCP connections dropped below 100.
      Possible network issue or server crash.
      @slack-fleetcore-alerts
      {{/is_alert}}
    tags: [service:ingestion-server, severity:high]

  - name: "API Error Rate > 5%"
    type: metric alert
    query: "avg(last_10m):( sum:trace.servlet.request.errors{service:core-api}.as_rate() / sum:trace.servlet.request.hits{service:core-api}.as_rate() ) * 100 > 5"
    message: |
      {{#is_alert}}
      🔴 API error rate is above 5% for the last 10 minutes.
      @slack-fleetcore-alerts @pagerduty-fleetcore
      {{/is_alert}}
    tags: [service:core-api, severity:critical]

  - name: "TimescaleDB Disk Usage > 80%"
    type: metric alert
    query: "avg(last_15m):avg:system.disk.in_use{host:fleetcore-timescaledb} * 100 > 80"
    message: |
      {{#is_alert}}
      💾 TimescaleDB disk usage above 80%. Consider running data retention policies.
      @slack-fleetcore-infra
      {{/is_alert}}
    tags: [service:timescaledb, severity:warning]
