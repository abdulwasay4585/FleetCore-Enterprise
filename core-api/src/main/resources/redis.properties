# FleetCore Enterprise — Redis Cache Configuration
# ===================================================
# Layer: L2 Cache for Spring Boot core-api
# Used for: session storage, rate limiting, hot telemetry lookups, ELD status cache

# ---- Connection ----
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.database=0
spring.data.redis.timeout=2000ms

# ---- Connection Pool (Lettuce) ----
spring.data.redis.lettuce.pool.max-active=32
spring.data.redis.lettuce.pool.max-idle=16
spring.data.redis.lettuce.pool.min-idle=4
spring.data.redis.lettuce.pool.max-wait=1000ms
spring.data.redis.lettuce.shutdown-timeout=200ms

# ---- Cache TTL Profiles ----
# Session cache — 8 hours rolling window
fleetcore.cache.session.ttl-seconds=28800

# Live telemetry hot cache — 10 second TTL (refreshed by Flink streaming processor)
fleetcore.cache.telemetry.ttl-seconds=10

# ELD driver status — 30 second TTL
fleetcore.cache.eld-status.ttl-seconds=30

# Asset directory lookup — 2 minutes
fleetcore.cache.assets.ttl-seconds=120

# IFTA jurisdiction tax rates — 24 hours
fleetcore.cache.ifta-rates.ttl-seconds=86400

# DTC dictionary — 1 hour (changes infrequently)
fleetcore.cache.dtc-dictionary.ttl-seconds=3600

# ---- Rate Limiting (Bucket4j + Redis) ----
# Default API key: 1000 req/min
fleetcore.ratelimit.default-rpm=1000
# Admin endpoints: 100 req/min
fleetcore.ratelimit.admin-rpm=100
# Webhook delivery retries: exponential backoff, max 5 attempts
fleetcore.ratelimit.webhook.max-retries=5
fleetcore.ratelimit.webhook.initial-backoff-ms=1000
fleetcore.ratelimit.webhook.backoff-multiplier=2.0

# ---- Spring Cache Manager ----
spring.cache.type=redis
spring.cache.cache-names=telemetry,assets,eld-status,dtc-dictionary,ifta-rates,sessions
