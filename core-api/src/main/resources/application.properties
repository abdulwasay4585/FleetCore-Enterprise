# ==============================================================================
# FleetCore Enterprise API — Spring Boot Production Configuration
# Target: PostgreSQL/TimescaleDB, Redis L2, Kafka, Python AI Sidecar
# All sensitive credentials MUST be passed via environment variables in production.
# ==============================================================================

spring.application.name=fleetcore-enterprise-api
server.port=${SERVER_PORT:8081}

# Database Configuration (Parameterized for Docker, Kubernetes & Cloud RDS)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/fleetcore_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fleetcore_admin}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Production Setup
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Redis Configuration (L2 Cache & Distributed Rate Limiting)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6380}}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=32
spring.data.redis.lettuce.pool.max-idle=16
spring.data.redis.lettuce.pool.min-idle=4
spring.data.redis.lettuce.pool.max-wait=1000ms

# Python AI & Mathematical Sidecar Integration
fleetcore.ai.sidecar.url=${AI_SIDECAR_URL:http://localhost:8098/api/v1/stretch/ai}
fleetcore.iridium.sbd.url=${IRIDIUM_SBD_URL:http://localhost:8098/api/v1/stretch/iridium}

# Actuator & Health Probes (K8s liveness & readiness)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Security & Cryptographic Tokens (Injected securely at runtime)
fleetcore.jwt.secret=${JWT_SECRET:}
fleetcore.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
fleetcore.erp.webhook-secret=${ERP_WEBHOOK_SECRET:}

# CORS & WebSocket Allowed Origins
fleetcore.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080}
fleetcore.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:*}

# Spring Cache Manager (Redis L2 Cache Layer)
spring.cache.type=redis
spring.cache.cache-names=telemetry,assets,eld-status,dtc-dictionary,ifta-rates,sessions

# Cache TTL Configuration (Seconds)
fleetcore.cache.telemetry.ttl-seconds=10
fleetcore.cache.assets.ttl-seconds=120
fleetcore.cache.eld-status.ttl-seconds=30
fleetcore.cache.dtc-dictionary.ttl-seconds=3600
fleetcore.cache.ifta-rates.ttl-seconds=86400
fleetcore.cache.session.ttl-seconds=28800

# Rate Limiting (Bucket4j over Redis)
fleetcore.ratelimit.default-rpm=1000
fleetcore.ratelimit.admin-rpm=100
